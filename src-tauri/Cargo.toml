[package]
name = "yougori"
version = "1.0.0"
description = "A local environment platform"
authors = ["Yougori"]
license-file = "../LICENSE"
publish = false
edition = "2021"

[lib]
name = "yougori_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json = "1"

[dependencies]
yougori-cli = { path = "../cli" }
portable-pty = "0.9"
opendock-cuda-runtime = { package = "opendock-cuda", path = "../runtime/cuda/host" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2.7.3"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
sysinfo = "0.37"
thiserror = "2"
sha2 = "0.10"
crc32fast = "1.5"
hex = "0.4"
base64 = "0.22"
keyring = "4.2"
age = "0.12.1"
tar = "0.4"
fatfs = "0.3.6"
tempfile = "3"
zstd = "0.13"
flate2 = "1"
object_store = { version = "0.14.1", features = ["aws", "azure", "gcp"] }
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
url = "2"
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls"] }
tokio-util = { version = "0.7", features = ["io", "io-util"] }
smoltcp = { version = "0.12", default-features = false, features = ["std", "medium-ethernet", "proto-ipv4", "socket-tcp"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_LibraryLoader",
  "Win32_System_SystemInformation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Security_Isolation",
  "Win32_System_JobObjects",
  "Win32_System_Performance",
  "Win32_System_Threading",
  "Win32_Storage_FileSystem",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "s"
panic = "abort"
strip = "symbols"
